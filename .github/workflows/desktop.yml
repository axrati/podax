name: Desktop builds

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: podax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: podax/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - name: Require the tag to match the package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          expected_tag="v${package_version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            printf 'Release tag %s does not match package version %s.\n' "$GITHUB_REF_NAME" "$package_version" >&2
            exit 1
          fi
      - run: npm run verify

  package:
    name: Package ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS universal
            platform: macos
            os: macos-latest
            command: npm run dist:mac -- --universal --publish never
            csc_link_secret: MAC_CSC_LINK
            csc_password_secret: MAC_CSC_KEY_PASSWORD
          - label: Windows x64 and ARM64
            platform: windows
            os: windows-latest
            command: npm run dist:win -- --x64 --arm64 --publish never
            csc_link_secret: WIN_CSC_LINK
            csc_password_secret: WIN_CSC_KEY_PASSWORD
          - label: Linux x64 and ARM64
            platform: linux
            os: ubuntu-latest
            command: npm run dist:linux -- --x64 --arm64 --publish never
            csc_link_secret: UNUSED_CSC_LINK
            csc_password_secret: UNUSED_CSC_PASSWORD
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: podax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: podax/package-lock.json
      - run: npm ci
      - run: npm test

      - name: Require release signing credentials
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform != 'linux'
        shell: bash
        env:
          CSC_LINK: ${{ secrets[matrix.csc_link_secret] }}
          CSC_KEY_PASSWORD: ${{ secrets[matrix.csc_password_secret] }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "$CSC_LINK" || { echo "Missing signing certificate secret"; exit 1; }
          test -n "$CSC_KEY_PASSWORD" || { echo "Missing signing certificate password"; exit 1; }
          if [ "${{ matrix.platform }}" = "macos" ]; then
            test -n "$APPLE_API_KEY_BASE64" || { echo "Missing APPLE_API_KEY"; exit 1; }
            test -n "$APPLE_API_KEY_ID" || { echo "Missing APPLE_API_KEY_ID"; exit 1; }
            test -n "$APPLE_API_ISSUER" || { echo "Missing APPLE_API_ISSUER"; exit 1; }
          fi

      - name: Prepare Apple notarization key
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          node -e "require('node:fs').writeFileSync(process.argv[1], Buffer.from(process.env.APPLE_API_KEY_BASE64, 'base64'))" "$key_path"
          grep -q "BEGIN PRIVATE KEY" "$key_path" || { echo "APPLE_API_KEY is not a base64-encoded .p8 key"; exit 1; }
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build installers
        env:
          CSC_LINK: ${{ secrets[matrix.csc_link_secret] }}
          CSC_KEY_PASSWORD: ${{ secrets[matrix.csc_password_secret] }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: ${{ matrix.command }}

      - name: Smoke test packaged macOS app
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          app_path="$(find release -maxdepth 2 -type d -name Podax.app | head -n 1)"
          test -n "$app_path"
          architectures="$(lipo -archs "$app_path/Contents/MacOS/Podax")"
          [[ " $architectures " == *" x86_64 "* ]]
          [[ " $architectures " == *" arm64 "* ]]
          codesign --verify --deep --strict --verbose=2 "$app_path"
          PODAX_SMOKE_TEST=1 "$app_path/Contents/MacOS/Podax"

      - name: Verify notarized macOS release
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'macos'
        shell: bash
        run: |
          app_path="$(find release -maxdepth 2 -type d -name Podax.app | head -n 1)"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"

      - name: Smoke test packaged Windows app
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $executable = Get-ChildItem release/win-unpacked -Filter Podax.exe | Select-Object -First 1
          if (-not $executable) { throw "Packaged executable was not found" }
          if (-not (Test-Path release/win-arm64-unpacked/Podax.exe)) {
            throw "Packaged ARM64 executable was not found"
          }
          $env:PODAX_SMOKE_TEST = "1"
          & $executable.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify signed Windows release
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installers = Get-ChildItem release -Filter *.exe
          if (-not $installers) { throw "No Windows installers were produced" }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne 'Valid') {
              throw "$($installer.Name) signature is $($signature.Status)"
            }
          }

      - name: Smoke test packaged Linux app
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          test -x release/linux-unpacked/podax
          test -x release/linux-arm64-unpacked/podax
          xvfb-run -a env PODAX_SMOKE_TEST=1 release/linux-unpacked/podax

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: podax-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            podax/release/*.dmg
            podax/release/*.zip
            podax/release/*.exe
            podax/release/*.AppImage
            podax/release/*.deb

  release:
    name: Publish signed release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: podax-*
          path: release-artifacts
          merge-multiple: true
      - name: Create checksums
        working-directory: release-artifacts
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Create GitHub release
        working-directory: release-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" ./* --verify-tag --generate-notes --title "Podax $GITHUB_REF_NAME"
